# SonarQube Configuration for Node.js Hexagonal Architecture
# Project identification
sonar.projectKey=arch-back-node-layer
sonar.projectName=Node.js Hexagonal Architecture - AWS Lambda Layer
sonar.projectVersion=1.0.0
sonar.organization=your-organization

# Source code configuration
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Language and file patterns
sonar.language=ts
sonar.typescript.node=node
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-results.json
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.d.ts,**/types/**,**/interfaces/**,src/server.ts

# Code analysis exclusions
sonar.exclusions=node_modules/**,dist/**,coverage/**,**/*.config.*,**/*.d.ts,**/types/**,**/interfaces/**

# Duplication exclusions
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts,**/types/**,**/interfaces/**

# Quality gate thresholds (aligned with vitest thresholds)
sonar.coverage.line.minimum=80
sonar.coverage.branch.minimum=80
sonar.coverage.function.minimum=80
sonar.coverage.statement.minimum=80

# Technical debt and maintainability
sonar.debt.grid=A,B,C,D,E
sonar.debt.ratingGrid=0.05,0.1,0.2,0.5

# Security and reliability
sonar.security.hotspots.inheritance=NONE
sonar.reliability.rating=A

# Code smells and maintainability
sonar.maintainability.rating=A
sonar.sqale.rating=A

# Additional TypeScript/JavaScript specific settings
sonar.typescript.exclusions=**/*.d.ts,**/node_modules/**
sonar.javascript.exclusions=**/node_modules/**,**/dist/**

# ESLint integration (if available)
sonar.eslint.reportPaths=eslint-report.json

# Working directory
sonar.working.directory=.sonarqube

# Branch analysis (for CI/CD)
# sonar.branch.name=main
# sonar.branch.target=main

# Pull request analysis (for CI/CD)
# sonar.pullrequest.key=
# sonar.pullrequest.branch=
# sonar.pullrequest.base=main